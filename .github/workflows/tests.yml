name: Tests

on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.failure-allowed }}
    strategy:
      # Report every ruby version rather than cancelling siblings on
      # the first failure.
      fail-fast: false
      matrix:
        # Exact versions: the Gemfile declares a ruby version, so the
        # installed one must match it exactly. 3.3.12 is what production runs.
        # 4.0.2 added to track upstream's newer coverage.
        ruby-version: ['3.3.12', '3.4.10', '4.0.2']
        failure-allowed: [false]
    env:
      # Overrides the Gemfile's default so each matrix entry declares the
      # ruby it actually installed.
      CUSTOM_RUBY_VERSION: ${{ matrix.ruby-version }}
    steps:
    - uses: actions/checkout@v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Run tests
      run: |
        ruby -v
        bundle exec rspec spec
